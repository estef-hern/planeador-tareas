<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papelera</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
</head>

<body>

  <main class="container py-5">

    <header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h1 class="h2 fw-bold mb-1">
          <i class="bi bi-trash me-2"></i>
          Papelera
        </h1>
        <p class="text-secondary mb-0">
          Aquí encontrarás las tareas que has eliminado.
        </p>
      </div>

      <a href="tareas.html" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>
        Volver a mis tareas
      </a>
    </header>

    <section>
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="h4 fw-bold mb-0">Tareas eliminadas</h2>

        <button
          type="button"
          class="btn btn-danger btn-sm"
          id="vaciarPapelera"
        >
          <i class="bi bi-trash3 me-1"></i>
          Vaciar papelera
        </button>
      </div>

      <div
        id="contenedor-papelera"
        class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-3"
      >
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/task-manager.js"></script>
  <script src="../js/papelera.js"></script>

</body>
</html>
