<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Tarea</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/crear-tarea.css" />
  </head>
  <body>
    <div class="formulario-container">
      <form id="formularioTarea" novalidate>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="titulo4">Título *</label>
            <input
              type="text"
              class="form-control"
              id="titulo4"
              name="titulo"
              placeholder="Nombra tu tarea"
            />
            <div class="error-message" id="errorTitulo"></div>
          </div>

          <div class="form-group col-md-6">
            <label for="inputdescripcion4">Descripción *</label>
            <input
              type="text"
              class="form-control"
              id="inputdescripcion4"
              name="descripcion"
              placeholder="Descripción"
            />
            <div class="error-message" id="errorDescripcion"></div>
          </div>
        </div>

        <div class="busqueda-personas">
          <div class="campo-asignado">
            <label for="inlineFormInput">Personas asignadas *</label>
            <input
              type="text"
              class="form-control"
              id="inlineFormInput"
              name="asignado"
              placeholder="Buscar por nombre"
            />
            <div class="error-message" id="errorAsignado"></div>
          </div>

          <div class="campo-usuario">
            <label for="inlineFormInputGroup">Buscar por usuario</label>

            <div class="input-group">
              <span class="input-group-text">@</span>
              <input
                type="text"
                class="form-control"
                id="inlineFormInputGroup"
                name="usuario"
                placeholder="Buscar por usuario"
              />
            </div>
          </div>
        </div>

        <div class="form-group col-md-6">
          <label for="categoria">Categoría</label>
          <select class="form-select" id="categoria" name="categoria">
            <option value="" selected>Ver categorías</option>
            <option value="trabajo">Trabajo</option>
            <option value="familia">Familia</option>
            <option value="personal">Personal</option>
            <option value="ninguna">Ninguna</option>
          </select>
        </div>

        <div class="form-group col-md-6">
          <label>Progreso *</label>
          <div class="progreso-botones">
            <input
              type="radio"
              class="btn-check"
              name="progreso"
              id="sinComenzar"
              value="sin_comenzar"
            />
            <label class="btn btn-outline-secondary" for="sinComenzar"
              >Sin comenzar</label
            >

            <input
              type="radio"
              class="btn-check"
              name="progreso"
              id="enCurso"
              value="en_curso"
            />
            <label class="btn btn-outline-info" for="enCurso">En curso</label>

            <input
              type="radio"
              class="btn-check"
              name="progreso"
              id="revision"
              value="revision"
            />
            <label class="btn btn-outline-warning" for="revision"
              >Revisión</label
            >

            <input
              type="radio"
              class="btn-check"
              name="progreso"
              id="completado"
              value="completado"
            />
            <label class="btn btn-outline-success" for="completado"
              >Completado</label
            >
          </div>
          <div class="error-message" id="errorProgreso"></div>
        </div>

        <div class="form-group col-md-6">
          <label for="fechaSimple" class="form-label">Fecha de entrega *</label>
          <input
            type="date"
            class="form-control"
            id="fechaSimple"
            name="fechaEntrega"
          />
          <div class="error-message" id="errorFecha"></div>
        </div>

        <button type="submit" class="btn btn-primary">Crear tarea</button>
      </form>
    </div>
    <div
      class="modal fade"
      id="modalTareaCreada"
      tabindex="-1"
      aria-labelledby="modalTareaCreadaLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTareaCreadaLabel">¡Hecho!</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body text-center">
            <p class="mb-0">Tu tarea se ha creado con éxito.</p>
          </div>

          <div class="modal-footer justify-content-center">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>

            <button type="button" class="btn btn-primary" id="btnVerTareas">
              Ver mis tareas
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/task-manager.js"></script>
    <script src="../js/crear-tarea.js"></script>
  </body>
</html>
