<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

    <form>
        <div class="form-row">
            <div class="form-group col-md-6">
            <label for="inputtitulo">Título</label>
            <input type="titulo" class="form-control" id="titulo4" placeholder="Nombra tu tarea">
            </div>
            <div class="form-group col-md-6">
            <label for="inputdescripcion4">Descripción</label>
            <input type="descripcion" class="form-control" id="inputescripcion4" placeholder="Descripción">
            <link rel="stylesheet" href="crear-tarea.css">
            </div>
        </div>
        
        <!-- agregar asignado -->
        <div class="row align-items-center">
            <div class="col-auto">
            <label class="sr-only" for="inlineFormInput">Personas asignadas</label>
            <input type="text" class="form-control mb-2" id="inlineFormInput" placeholder="Buscar por nombre">
            </div>
   
            <div class="col-auto">
            <label class="sr-only" for="inlineFormInputGroup"></label>
            <div class="input-group mb-2">
                <div class="input-group-prepend">
                <div class="input-group-text">@</div>
                </div>
                <input type="text" class="form-control" id="inlineFormInputGroup" placeholder="Buscar por usuario">
            </div>
        </div>
    

        <div class="form-group col-md-6">
            <label for="categoria">Categoría</label>
            <select class="custom-select">
            <option selected>Ver categorías</option>
            <option value="1">Trabajo</option>
            <option value="2">Familia</option>
            <option value="3">Personal</option>
            <option value="4">Ninguna</option>
            </select>
        </div>


        <div class="form-group col-md-6">
            <label for="progreso">Progreso</label>
                <div class="progreso-botones">
                    <button type="button" class="btn-outline theme-accent">
                        Sin comenzar
                    </button>
                    <button type="button" class="btn-outline theme-info">
                        En curso
                    </button>
                    <button type="button" class="btn-outline theme-success">
                        Completado
                    </button>
                </div>       
        </div>
  

    <div class="mb-3">
    <label for="fechaSimple" class="form-label">Fecha de entrega</label>
    <input type="date" class="form-control" id="fechaSimple">
    </div>

    <button type="submit" class="btn btn-primary">Crear tarea</button>
    </form>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
